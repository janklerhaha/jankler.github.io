<!DOCTYPE html>
<html>
<head>
  <title>Jankler</title>
  <style>
    body {
      background-color: black;
      color: purple;
      font-family: monospace;
      text-align: center;
    }

    #chatbox {
      width: 90%;
      max-width: 500px;
      height: 400px;
      margin: 20px auto;
      border: 2px solid purple;
      overflow-y: auto;
      padding: 10px;
      background-color: #000;
    }

    input {
      width: 70%;
      padding: 5px;
      background: black;
      color: purple;
      border: 1px solid purple;
    }

    button {
      padding: 5px;
      background: purple;
      color: black;
      border: none;
      cursor: pointer;
    }

    p {
      margin: 5px 0;
    }
  </style>
</head>
<body>

<h1>Jankler</h1>
<p>The chaos has logged in...</p>

<div id="chatbox"></div>

<input type="text" id="userInput" placeholder="Speak to Jankler...">
<button onclick="sendMessage()">Send</button>

<script>
let chaosLevel = 0;

function escapeHTML(str) {
  return str.replace(/[&<>"']/g, function(m) { 
    return {'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[m]; 
  });
}

function sendMessage() {
  let input = document.getElementById("userInput").value.trim();
  if (!input) return;

  let chatbox = document.getElementById("chatbox");
  chatbox.innerHTML += "<p><b>You:</b> " + escapeHTML(input) + "</p>";

  chaosLevel++;

  let response = getResponse(input);
  chatbox.innerHTML += "<p><b>Jankler:</b> " + response + "</p>";

  document.getElementById("userInput").value = "";
  chatbox.scrollTop = chatbox.scrollHeight;
}

function getResponse(message) {
  message = message.toLowerCase();

  // Specific triggers
  if (message.includes("hello")) return "Hello, beautiful chaos! Have you come to play?";
  if (message.includes("who are you")) return "Who am I? Oh, just your worst nightmare in a smile!";
  if (message.includes("batman")) return "Batsy... always lurking. Pathetic, really.";
  if (message.includes("jankler")) return "HAHAHAHA! You called me?! You fool.";
  if (message.includes("harley quinn")) return "That taste good";
  if (message.includes("schwoz")) return "This mainframe is not hackable.";
  if (message.includes("captain man")) return "That's why you have a Jank! HAHAHAHAHA!";
  if (message.includes("scars")) return "Do you wanna know how I got these scars?";
  if (message.includes("beans")) return "Jankler Beans.";
  if (message.includes("cold3274")) return "That bitch";
  if (message.includes("badonkadonk")) return "Okay, okay, you had your fun.";
  if (message.includes("liam")) return "That bitch";
  if (message.includes("?")) return "I'm not in the mood to answer any questions.";
  if (message.includes("!")) return "Stop yelling at me dad! HAHAHAHAHA!.";
  if (message.includes("i am normal")) return "Whatever";
  if (message.includes("subspace")) return "Gross";
  if (message.includes("johnathang")) return "Ugh, the one man even im not crazy enough to talk about.";
  if (message.includes("gru")) return "Ahh, bobbys right hand man! Of course, a tragedy what happened to him. It made a perfect comedy!";
  if (message.includes("medkit")) return "We dont like femboys where im from, or anywhere!";
  if (message.includes("67")) return "HAHAHAHAHAHAHAHAHAHAH, I got it.. The Bats weakness. Of course!";
  if (message.includes("lenen beast")) return "Lenen beast? I haven't heard that name in a while. He was not the best man let me tell you that. Hah, always so cheery. Until Mr. Beast said he wasnt cool, all lenen wanted to do was help. Such a shame what he did to Gru after that.";
  if (message.includes("pedroptray")) return "Ugh, that kid.";
  if (message.includes("jeffery epstein")) return "A little birdie told me Batman *was* on the island!";
  if (message.includes("jamaal gamble")) return "Gotta love him!";
  if (message.includes("absi")) return "Gross, that guy only loves that Kendall chick and always sings about chunky. He called me the Jonkler.";
  if (message.includes("jonkler")) return "Life provoked. Room filling with laughing gas.";
  if (message.includes("joker")) return "Life provoked. Room filling with laughing gas.";
  if (message.includes("patrick")) return "Patchunky";
  if (message.includes("patchunky")) return "patrick";

  // Joker-style chaotic responses
  const responses = [
    "Do you like pain? I *love* it!",
    "Yeah",
    "Hahaha! That was hilarious, or was it tragic?",
    "Oh, come on! You can't be serious!",
    "Why so serious? Let’s put a smile on that face!",
    "This is my playground, and you’re my toy!",
    "Madness is like gravity — all it takes is a little push.",
    "You think you’re in control? Cute.",
    "I dance on chaos... care to join me?",
    "Your fear is delicious!",
    "Life’s a joke, and I’m the punchline!",
    "Hahaha... and you wonder why I laugh?",
    "Smile, because the joke’s on you!",
    "Creepy? Maybe. Funny? Always!",
    "Ohhhh, you *really* shouldn’t have said that!",
    "Time to turn this day upside down!"
  ];

  // Chaos effect: after some messages, Joker gets wilder
  if (chaosLevel > 5) {
    const chaosResponses = [
      "HAHAHAHA! Yes! Yes! YES!",
      "The fun is just beginning!",
      "I could do this forever, you know!",
      "The walls are laughing with me!",
      "Hahaha! I *am* the chaos!",
      "Why stop the party now?"
    ];
    if (Math.random() > 0.5) {
      return chaosResponses[Math.floor(Math.random() * chaosResponses.length)];
    }
  }

  return responses[Math.floor(Math.random() * responses.length)];
}

// Support pressing Enter to send
document.getElementById("userInput").addEventListener("keydown", function(e) {
  if (e.key === "Enter") sendMessage();
});
</script>

</body>
</html>
