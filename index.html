<!DOCTYPE html>
<html>
<head>
  <title>Jankler AI</title>
  <style>
    body {
      background-color: black;
      color: purple;
      font-family: monospace;
      text-align: center;
    }

    #chatbox {
      width: 90%;
      max-width: 500px;
      height: 400px;
      margin: 20px auto;
      border: 2px solid purple;
      overflow-y: auto;
      padding: 10px;
    }

    input {
      width: 70%;
      padding: 5px;
      background: black;
      color: purple;
      border: 1px solid purple;
    }

    button {
      padding: 5px;
      background: purple;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>Jankler AI</h1>
<p>The chaos has logged in...</p>

<div id="chatbox"></div>

<input type="text" id="userInput" placeholder="Speak to Jankler...">
<button onclick="sendMessage()">Send</button>

<script>
let chaosLevel = 0;

function sendMessage() {
  let input = document.getElementById("userInput").value;
  let chatbox = document.getElementById("chatbox");

  if (!input) return;

  chatbox.innerHTML += "<p><b>You:</b> " + input + "</p>";
  chaosLevel++;

  let response = getResponse(input);
  chatbox.innerHTML += "<p><b>Jankler:</b> " + response + "</p>";

  document.getElementById("userInput").value = "";
  chatbox.scrollTop = chatbox.scrollHeight;
}

function getResponse(message) {
  message = message.toLowerCase();

  // Specific triggers
  if (message.includes("hello")) return "Hello, beautiful chaos! Have you come to play?";
  if (message.includes("who are you")) return "Who am I? Oh, just your worst nightmare in a smile!";
  if (message.includes("batman")) return "Batsy... always lurking. Pathetic, really.";
  if (message.includes("jankler")) return "HAHAHAHA! You called me?! You fool.";
  if (message.includes("Harley Quinn")) return "That reminds me! HAHA!";
  if (message.includes("Schwoz")) return "This mainframe is not hackable.";
  if (message.includes("Captain Man")) return "Thats why you have a Jank! HAHAHAHAHA!";
  if (message.includes("Scars")) return "Do you wanna know how i got these scars?";
  if (message.includes("Beans")) return "Jankler Beans.";
  if (message.includes("cold3274")) return "That bitch";\
  if (message.includes("liam")) return "That bitch";

  // Joker-style chaotic responses
  const responses = [
    "Do you like pain? I *love* it!",
    "Hahaha! That was hilarious, or was it tragic?",
    "Oh, come on! You can't be serious!",
    "Why so serious? Let’s put a smile on that face!",
    "This is my playground, and you’re my toy!",
    "Madness is like gravity — all it takes is a little push.",
    "You think you’re in control? Cute.",
    "I dance on chaos... care to join me?",
    "Your fear is delicious!",
    "Life’s a joke, and I’m the punchline!",
    "Hahaha... and you wonder why I laugh?",
    "Smile, because the joke’s on you!",
    "Creepy? Maybe. Funny? Always!",
    "Ohhhh, you *really* shouldn’t have said that!",
    "Time to turn this day upside down!"
  ];

  // Chaos effect: after some messages, Joker gets wilder
  if (chaosLevel > 5) {
    const chaosResponses = [
      "HAHAHAHA! Yes! Yes! YES!",
      "The fun is just beginning!",
      "I could do this forever, you know!",
      "The walls are laughing with me!",
      "Hahaha! I *am* the chaos!",
      "Why stop the party now?"
    ];
    if (Math.random() > 0.5) {
      return chaosResponses[Math.floor(Math.random() * chaosResponses.length)];
    }
  }

  return responses[Math.floor(Math.random() * responses.length)];
}
</script>

</body>
</html>
