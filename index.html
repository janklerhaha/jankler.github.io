<!DOCTYPE html>
<html>
<head>
  <title>Janker AI</title>
  <style>
    body {
      background-color: black;
      color: lime;
      font-family: monospace;
      text-align: center;
    }

    #chatbox {
      width: 90%;
      max-width: 500px;
      height: 400px;
      margin: 20px auto;
      border: 2px solid lime;
      overflow-y: auto;
      padding: 10px;
    }

    input {
      width: 70%;
      padding: 5px;
      background: black;
      color: lime;
      border: 1px solid lime;
    }

    button {
      padding: 5px;
      background: lime;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>

<h1>JANKER AI</h1>
<p>The chaos has logged in...</p>

<div id="chatbox"></div>

<input type="text" id="userInput" placeholder="Speak to Janker...">
<button onclick="sendMessage()">Send</button>

<script>
let chaosLevel = 0;

function sendMessage() {
  let input = document.getElementById("userInput").value;
  let chatbox = document.getElementById("chatbox");

  if (!input) return;

  chatbox.innerHTML += "<p><b>You:</b> " + input + "</p>";
  chaosLevel++;

  let response = getResponse(input);
  chatbox.innerHTML += "<p><b>Janker:</b> " + response + "</p>";

  document.getElementById("userInput").value = "";
  chatbox.scrollTop = chatbox.scrollHeight;
}

function getResponse(message) {
  message = message.toLowerCase();

  if (message.includes("hello")) return "Oh good... another test subject.";
  if (message.includes("who are you")) return "I am the glitch in your browser.";
  if (message.includes("batman")) return "We do not speak that name.";
  if (message.includes("janker")) return "HAHAHAHA.";

  const responses = [
    "Interesting...",
    "The chaos grows.",
    "Tell me more.",
    "You cannot escape this tab.",
    "Society coded me.",
    "HAHAHAHAHAHA"
  ];

  if (chaosLevel > 5) {
    return "The chaos level is rising... I like it.";
  }

  return responses[Math.floor(Math.random() * responses.length)];
}
</script>

</body>
</html>
